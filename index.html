<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>IAS Alarm & Tag Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Offline search of Al Areef IAS (K-Chief 700), AutoChief 600 and WinGD X72DF-2.1 tags, alarms, set points and signal paths.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1f4">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one sticky search band over a single reading column of record cards; console-like role colours encode A/S/C/L/I. */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#122130; --muted:#586777; --line:#d6dde4; --soft:#f5f7f9;
  --accent:#1d5d8c; --accent-ink:#ffffff; --chip:#e6eef5; --hl:#ffe69a;
  --a:#9a5b00; --a-bg:#fcefd8;           /* alarm & monitoring (IAS) */
  --s:#b3261e; --s-bg:#fbe6e3;           /* safety: shutdown / slowdown / ESD */
  --c:#1d5d8c; --c-bg:#e1ecf6;           /* control */
  --l:#2f6b45; --l-bg:#e1f0e6;           /* local gauge / local panel */
  --i:#5a4a8c; --i-bg:#ebe7f6;           /* indication only */
  --x:#5f6b77; --x-bg:#eceff2;
  --err:#b3261e; --scrim:rgba(8,14,20,.7);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d151c; --card:#15212b; --ink:#e3e9ee; --muted:#93a2b0; --line:#25333f; --soft:#111b24;
    --accent:#6fb3e6; --accent-ink:#06121c; --chip:#1b2a37; --hl:#5a4a00;
    --a:#f0b44c; --a-bg:#3a2a10; --s:#ff8a7e; --s-bg:#3d1714; --c:#7cbbe9; --c-bg:#132c40;
    --l:#7fcf9c; --l-bg:#14301f; --i:#b7a6f0; --i-bg:#271f42; --x:#a6b1bb; --x-bg:#1f2a34;
    --err:#ff8a7e; --scrim:rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d151c; --card:#15212b; --ink:#e3e9ee; --muted:#93a2b0; --line:#25333f; --soft:#111b24;
  --accent:#6fb3e6; --accent-ink:#06121c; --chip:#1b2a37; --hl:#5a4a00;
  --a:#f0b44c; --a-bg:#3a2a10; --s:#ff8a7e; --s-bg:#3d1714; --c:#7cbbe9; --c-bg:#132c40;
  --l:#7fcf9c; --l-bg:#14301f; --i:#b7a6f0; --i-bg:#271f42; --x:#a6b1bb; --x-bg:#1f2a34;
  --err:#ff8a7e; --scrim:rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.42 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#app,#lock{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);max-width:820px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand small{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:6px;align-items:center}
#back{flex:none;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:12px;height:46px;padding:0 12px;font-size:15px}
.search{position:relative;flex:1;min-width:0}
input{font:inherit}
.search input{width:100%;font-size:17px;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;width:34px;height:34px}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#status{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
main{padding-block:10px calc(env(safe-area-inset-bottom, 0px) + 24px);max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
.card.exact{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kind{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ttl{font-weight:650;font-size:16px;word-break:break-word;text-wrap:balance}
.desc{font-size:14.5px;margin-top:2px;word-break:break-word}
.sub{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:600 14px/1.2 var(--mono);padding:6px 9px;border-radius:8px;background:var(--chip);border:0;color:var(--ink);cursor:pointer;text-align:left;word-break:break-all}
.tag .lbl{display:block;font:500 10px/1.2 var(--sans);opacity:.75;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.tag.go::after{content:" \2192";opacity:.6}
.tag.small{font-size:12.5px;padding:4px 7px}
.role{font:700 11px/1 var(--sans);letter-spacing:.04em;border-radius:6px;padding:4px 6px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.rA{color:var(--a);background:var(--a-bg)} .rS{color:var(--s);background:var(--s-bg)} .rC{color:var(--c);background:var(--c-bg)}
.rL{color:var(--l);background:var(--l-bg)} .rI{color:var(--i);background:var(--i-bg)} .rX{color:var(--x);background:var(--x-bg)}
.dA{background:var(--a)} .dS{background:var(--s)} .dC{background:var(--c)} .dL{background:var(--l)} .dI{background:var(--i)} .dX{background:var(--x)}
.fields{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;margin-top:10px;font-size:14px;line-height:1.35}
.fl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fv{min-width:0;word-break:break-word}
.lim{display:inline-flex;gap:4px;flex-wrap:wrap}
.lim span{font:600 12.5px/1.2 var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.lim b{font:700 10px var(--sans);color:var(--muted);margin-right:3px}
.sec{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sech{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
/* signal path */
.path{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
.node{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 8px;font-size:13px;min-width:0;flex:0 1 auto;max-width:100%}
.node b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.node code{font:600 12.5px var(--mono)}
.arrow{align-self:center;color:var(--muted);font-size:14px;padding:0 1px}
/* sensor breakdown */
.count{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.count .role{font-size:12px;padding:5px 8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .meta{font-size:13px;min-width:0;word-break:break-word}
/* io rows */
.iorow{padding:7px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
.iorow:first-of-type{border-top:0;padding-top:0}
.iohead{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.iohead code{font:700 13.5px var(--mono);word-break:break-all}
.eng{font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.ioaddr{font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-word}
.ioaddr b{font-family:var(--mono)}
/* io table */
.tw{overflow-x:auto;margin-top:2px}
table.io{border-collapse:collapse;font-size:12.5px;min-width:100%}
table.io th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:700;padding:4px 8px 4px 0;white-space:nowrap}
table.io td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.io td code{font:600 12px var(--mono)}
.items{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.items dt{color:var(--muted);font-weight:600;min-width:0;word-break:break-word}
.items dd{margin:0;min-width:0;word-break:break-word;white-space:pre-line}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
ol.steps li{margin:3px 0}
.refs{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.refs span{display:inline-block;margin-right:10px}
.note{font-size:12px;margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--a-bg);color:var(--a)}
.link{border:0;background:none;color:var(--accent);font-size:13.5px;padding:6px 0 0;cursor:pointer;text-align:left}
details{margin-top:6px;font-size:13.5px}
details summary{color:var(--accent);cursor:pointer}
mark{background:var(--hl);color:inherit;border-radius:3px}
.empty{color:var(--muted);padding:18px 4px 30px}
.empty h2{font-size:15px;color:var(--ink);margin:18px 0 8px;letter-spacing:.01em}
.empty p{margin:6px 0;font-size:14px}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ex button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;font-size:13.5px;color:var(--ink);align-items:center}
.syslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.syslist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:13.5px}
.syslist button span{color:var(--muted);font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.offl{max-width:820px;margin:0 auto;font-size:12.5px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);text-align:center}
.offl.ok{color:var(--l);border-color:var(--l)}
.offl.bad{color:var(--a);border-color:var(--a)}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding-block:8px 30px;max-width:820px;margin:0 auto;line-height:1.5}
#lock{padding-block:18vh 24px}
.lockbox{width:100%;max-width:380px;margin:0 auto}
.lockbox h1{font-size:22px;margin:0 0 6px}
.lockbox p{color:var(--muted);font-size:15px}
.lockbox input{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.06em;-webkit-appearance:none;appearance:none}
.lockbox button{width:100%;margin-top:10px;font-size:17px;padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.lockbox .err{color:var(--err);min-height:20px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<div id="lock" hidden>
  <div class="lockbox">
    <h1>IAS Alarm &amp; Tag Finder</h1>
    <p>Enter your access code. You only need to do this once on each device.</p>
    <form id="lockform">
      <input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx xxxx xxxx xxxx" aria-label="Access code">
      <button type="submit">Unlock</button>
    </form>
    <p id="lockmsg" class="err" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><h1>IAS Alarm &amp; Tag Finder</h1><small id="count"></small></div>

  <main id="out"></main>

</div>

<script>
(async function(){
"use strict";
const ENC = JSON.parse(document.getElementById('data').textContent);
const KEYNAME = 'ias-tag-finder-key-v1';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
function save(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(_){} }
function load(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
async function deriveRaw(code){
  const norm = code.toLowerCase().replace(/[^a-z0-9]/g, '');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function unlock(){
  return new Promise(resolve => {
    $('lock').hidden = false;
    const msg = t => { $('lockmsg').textContent = t; };
    if (!window.crypto || !crypto.subtle) msg('Open this page from its https:// address.');
    else if (typeof DecompressionStream === 'undefined') msg('Please update your browser (iOS 16.4 or newer is needed).');
    $('lockform').addEventListener('submit', async e => {
      e.preventDefault(); msg('Checking…');
      try { const raw = await deriveRaw($('code').value); const d = await decrypt(raw); save(KEYNAME, toB64(raw)); $('lock').hidden = true; resolve(d); }
      catch(_) { msg('That code did not work. Check it and try again.'); }
    });
  });
}
let D = null;
const saved = load(KEYNAME);
if (saved){ try { D = await decrypt(b64(saved)); } catch(_) { save(KEYNAME, null); } }
if (!D) D = await unlock();
$('app').hidden = false;

// ---------------- data ----------------
const SYS = D.sys, DOCS = D.docs;
const ROLE = {A:'Alarm (IAS)', S:'Safety', C:'Control', L:'Local', I:'Indication', X:'Equipment'};
const ROLELONG = {A:'Alarm & monitoring system (IAS / AMS)', S:'Safety system (shutdown, slowdown, trip, ESD)', C:'Control system (WECS, AutoChief, IAS control)', L:'Local gauge or local panel', I:'Remote indication only', X:'Equipment or valve tag (no alarm function stated in the manual)'};
const rows = [];
D.sig.forEach((r, i) => rows.push(Object.assign({T:'sig', i}, r)));
D.grp.forEach((r, i) => rows.push(Object.assign({T:'grp', i}, r)));
D.fn.forEach((r, i) => rows.push(Object.assign({T:'fn', i}, r)));
D.scr.forEach((r, i) => rows.push(Object.assign({T:'scr', i}, r)));
D.unit.forEach((r, i) => rows.push(Object.assign({T:'unit', i}, r)));
D.cab.forEach((r, i) => rows.push(Object.assign({T:'cab', i}, r)));
D.how.forEach((r, i) => rows.push(Object.assign({T:'how', i}, r)));
const BYKEY = new Map(); D.sig.forEach((r, i) => BYKEY.set(r.k, i));

const norm = s => String(s == null ? '' : s).toLowerCase();
const squash = s => norm(s).replace(/[^a-z0-9]/g, '');
function txt(v){ if (v == null) return ''; if (Array.isArray(v)) return v.map(txt).join(' '); if (typeof v === 'object') return Object.values(v).map(txt).join(' '); return String(v); }
for (const r of rows){
  let parts;
  if (r.T === 'sig') parts = [r.k, r.t, r.d, SYS[r.s], r.eq, r.st, r.sg, r.rg, r.sp, r.ac, r.dl, r.from, r.to, r.box, r.pn, r.n, txt(r.lim), (r.io || []).map(x => [x.tag, x.d, 'dpu ' + x.dpu, x.mod, x.cab, 'ch ' + x.ch, x.term, x.fc, x.sp, x.n].join(' ')).join(' '), (r.cf || []).join(' '), (r.rl || []).map(x => ROLE[x]).join(' ')];
  else if (r.T === 'grp') parts = [r.title, SYS[r.s], r.note, r.sig.map(i => D.sig[i].k + ' ' + (D.sig[i].t || []).join(' ')).join(' ')];
  else if (r.T === 'fn') parts = [r.title, SYS[r.s], r.eq, txt(r.items), txt(r.al), (r.tags || []).join(' '), r.n];
  else if (r.T === 'scr') parts = [r.title, r.sec, 'mimic screen page ' + r.page, (r.tags || []).join(' '), (r.sys || []).map(s => SYS[s]).join(' ')];
  else if (r.T === 'unit') parts = [r.name, r.type, r.loc, SYS[r.s], txt(r.conn), txt(r.fn), r.n];
  else if (r.T === 'cab') parts = ['cable', r.no, r.type, r.sig, r.from, r.to, r.n];
  else parts = [r.title, SYS[r.s], txt(r.steps)];
  const p = parts.filter(Boolean).join(' | ');
  r.hay = norm(p); r.hayS = squash(p);
}
$('count').textContent = rows.length.toLocaleString() + ' entries';

// ---------------- helpers ----------------
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let TOKS = [];
function hl(text){
  const s = esc(text);
  if (!TOKS.length) return s;
  const re = new RegExp('(' + TOKS.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
const roleBadge = (r, extra) => '<span class="role r' + r + '" title="' + esc(ROLELONG[r] || '') + '">' + esc(ROLE[r] || r) + (extra ? ' ' + extra : '') + '</span>';
const field = (l, h) => h ? '<div class="fl">' + l + '</div><div class="fv">' + h + '</div>' : '';
const go = (tag, lbl, cls) => '<button class="tag go' + (cls ? ' ' + cls : '') + '" data-go="' + esc(tag) + '">' + (lbl ? '<span class="lbl">' + esc(lbl) + '</span>' : '') + hl(tag) + '</button>';
const copyChip = (tag, lbl) => '<button class="tag" data-copy="' + esc(tag) + '">' + (lbl ? '<span class="lbl">' + esc(lbl) + '</span>' : '') + hl(tag) + '</button>';
function limits(l){
  if (!l) return '';
  const order = ['LL','L','H','HH'];
  const ks = Object.keys(l).sort((a, b) => (order.indexOf(a) + 9) % 13 - (order.indexOf(b) + 9) % 13);
  return '<span class="lim">' + ks.map(k => '<span><b>' + esc(k) + '</b>' + hl(l[k]) + '</span>').join('') + '</span>';
}
function refs(list){
  if (!list || !list.length) return '';
  return '<div class="refs">' + list.map(x => '<span>' + esc(DOCS[x[0]] ? DOCS[x[0]].t : '?') + (x[1] ? ' · ' + esc(x[1]) : '') + (x[2] ? ' · ' + esc(x[2]) : '') + '</span>').join('') + '</div>';
}
const sysLine = r => esc(SYS[r.s] || '') + (r.eq ? ' · ' + hl(r.eq) : '');
let engine = '';
function ioRows(r){
  let io = r.io || [];
  if (engine) io = io.filter(x => !x.e || x.e === engine);
  if (!io.length) return '';
  return '<div class="sec"><div class="sech">IAS / AutoChief I/O address' + (io.length > 1 ? 'es' : '') + '</div>' +
    io.map(x => '<div class="iorow"><div class="iohead">' + (x.e ? '<span class="eng">' + (x.e === 'P' ? 'Port' : 'Stbd') + '</span>' : '') + '<code>' + hl(x.tag) + '</code>' + (x.fc ? '<span class="sub">' + hl(x.fc) + '</span>' : '') + '</div>' +
      '<div class="ioaddr">' + [x.dpu ? 'DPU <b>' + hl(x.dpu) + '</b>' + (x.mod ? ' ' + hl(x.mod) : '') : '', x.ch ? 'ch <b>' + hl(x.ch) + '</b>' : '', x.term ? 'terminal <b>' + hl(x.term) + '</b>' : '', x.cab ? 'cabinet ' + hl(x.cab) : ''].filter(Boolean).join(' · ') + '</div>' +
      (x.d && norm(x.d) !== norm(r.d) ? '<div class="sub">' + hl(x.d) + '</div>' : '') +
      (x.lim ? '<div>' + limits(x.lim) + '</div>' : '') + (x.sp ? '<div class="sub">' + hl(x.sp) + '</div>' : '') +
      (x.ag ? '<div class="sub">Alarm group ' + hl(x.ag) + '</div>' : '') + (x.n ? '<div class="sub">' + hl(x.n) + '</div>' : '') + '</div>').join('') + '</div>';
}
function signalPath(r){
  const nodes = [];
  if (r.from) nodes.push(['From', hl(r.from)]);
  if (r.box) nodes.push(['Engine box / unit', '<code>' + hl(r.box) + '</code>']);
  const io = (r.io || []).filter(x => !engine || !x.e || x.e === engine);
  const dp = [...new Set(io.filter(x => x.dpu).map(x => (x.e ? x.e + ': ' : '') + 'DPU ' + x.dpu + (x.mod ? ' ' + x.mod : '') + (x.ch ? ' ch ' + x.ch : '') + (x.term ? ' · ' + x.term : '')))];
  if (dp.length) nodes.push(['Kongsberg I/O', dp.map(x => '<code>' + hl(x) + '</code>').join('<br>')]);
  const cab = [...new Set(io.map(x => x.cab).filter(Boolean))];
  if (cab.length) nodes.push(['Cabinet', hl(cab.join(', '))]);
  if (r.to) nodes.push(['To', hl(r.to)]);
  if (nodes.length < 2) return '';
  return '<div class="sec"><div class="sech">Signal path</div><div class="path">' + nodes.map((n, i) => (i ? '<span class="arrow" aria-hidden="true">&#8594;</span>' : '') + '<div class="node"><b>' + n[0] + '</b>' + n[1] + '</div>').join('') + '</div></div>';
}
function groupSection(r){
  if (r.g == null) return '';
  const g = D.grp[r.g];
  const sibs = g.sig.filter(i => D.sig[i].k !== r.k);
  return '<div class="sec"><div class="sech">Same measurement — ' + esc(g.title) + '</div>' + countPills(g) +
    (sibs.length ? '<div class="chips">' + sibs.map(i => { const s = D.sig[i]; return '<span style="display:inline-flex;gap:4px;align-items:center">' + go(s.k, (s.rl || []).map(x => ROLE[x]).join(' / ')) + '</span>'; }).join('') + '</div>' : '') + '</div>';
}
const SYSSCR = new Map();
function sysScreens(r){
  if (!SYSSCR.has(r.s)){
    const l = [];
    D.scr.forEach((x, i) => { if ((x.sys || []).includes(r.s) && (!r.e || !x.e || x.e === (r.e === 'P' ? 'P' : r.e === 'S' ? 'S' : x.e))) l.push(i); });
    SYSSCR.set(r.s, l.slice(0, 6));
  }
  return SYSSCR.get(r.s);
}
function countPills(g){
  const c = g.cnt || {};
  return '<div class="count">' + ['A','S','C','L','I','X'].filter(k => c[k]).map(k => roleBadge(k, '× ' + c[k])).join('') + '</div>';
}

// ---------------- cards ----------------
function cardSig(r, exact){
  const tags = r.t && r.t.length ? r.t : [r.k];
  return '<div class="card' + (exact ? ' exact' : '') + '">' +
    '<div class="kind">' + (r.rl || ['X']).map(x => roleBadge(x)).join('') + '<span>' + sysLine(r) + '</span>' + (r.e ? '<span>ME ' + (r.e === 'P' ? 'Port' : r.e === 'S' ? 'Stbd' : 'Port + Stbd') + '</span>' : '') + (r.cy ? '<span>Cyl. ' + esc(r.cy) + '</span>' : '') + '</div>' +
    '<div class="chips" style="margin-top:2px">' + copyChip(r.k, 'Tag') + tags.filter(t => t !== r.k).map(t => copyChip(t, 'As printed')).join('') + '</div>' +
    '<div class="desc">' + hl(r.d) + '</div>' +
    '<div class="fields">' +
      field('Sensor', hl(r.st)) + field('Signal', hl(r.sg)) + field('Range', hl(r.rg) + (r.u && !(r.rg || '').includes(r.u) ? ' <span class="sub">' + esc(r.u) + '</span>' : '')) +
      field('Limits', limits(r.lim)) + field('Set point', hl(r.sp)) + field('Action', hl(r.ac)) + field('Delay', hl(r.dl)) + field('Part no.', hl(r.pn)) +
    '</div>' +
    signalPath(r) + ioRows(r) +
    (r.cf && r.cf.length ? '<div class="sec"><div class="sech">AutoChief safety configuration</div>' + r.cf.filter(c => !engine || c.indexOf(engine === 'P' ? 'Stbd:' : 'Port:') !== 0).map(c => '<div style="font-size:13.5px;margin:3px 0">' + hl(c) + '</div>').join('') + '</div>' : '') +
    groupSection(r) +
    (r.rel && r.rel.length ? '<div class="sec"><div class="sech">Follow-up tags</div><div class="chips">' + r.rel.map(t => go(t, '', 'small')).join('') + '</div></div>' : '') +
    (r.fn && r.fn.length ? '<div class="sec"><div class="sech">Logic that uses it</div>' + r.fn.map(i => '<div><button class="link" data-fn="' + i + '">' + esc(D.fn[i].title) + ' &#8594;</button></div>').join('') + '</div>' : '') +
    (r.scr && r.scr.length ? '<div class="sec"><div class="sech">Shown on IAS screen</div>' + r.scr.map(i => '<div><button class="link" data-scr="' + i + '">' + esc(D.scr[i].title) + ' <span class="sub">(mimic book p.' + esc(D.scr[i].page) + ')</span></button></div>').join('') + '</div>' :
      sysScreens(r).length ? '<div class="sec"><div class="sech">IAS screens for this system</div>' + sysScreens(r).map(i => '<div><button class="link" data-scr="' + i + '">' + esc(D.scr[i].title) + ' <span class="sub">(p.' + esc(D.scr[i].page) + ')</span></button></div>').join('') + '</div>' : '') +
    (r.n ? '<div class="sec"><div class="sech">Notes</div><div style="font-size:13.5px;white-space:pre-line">' + hl(r.n) + '</div></div>' : '') +
    (r.ocr ? '<div class="note">Read by OCR from a scanned page. Check the value on the page before you use it.</div>' : '') +
    refs(r.ref) + '</div>';
}
function cardGrp(r, exact){
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>Sensor group</span><span>' + sysLine(r) + '</span></div>' +
    '<div class="ttl">' + hl(r.title) + '</div>' + countPills(r) +
    (r.note ? '<div class="sub" style="margin-top:6px">' + hl(r.note) + '</div>' : '') +
    '<div class="sec">' + r.sig.map(i => { const s = D.sig[i];
      return '<div class="srow"><div>' + go(s.k) + '</div><div class="meta">' + (s.rl || ['X']).map(x => roleBadge(x)).join(' ') + ' ' + hl(s.d) +
        (s.sp || s.ac ? '<div class="sub">' + hl([s.ac, s.sp, s.dl].filter(Boolean).join(' · ')) + '</div>' : '') +
        (s.lim ? '<div>' + limits(s.lim) + '</div>' : '') + (s.rg ? '<div class="sub">' + hl(s.st || '') + (s.st ? ' · ' : '') + hl(s.rg) + '</div>' : '') + '</div></div>'; }).join('') + '</div></div>';
}
function cardFn(r, exact, open){
  const items = r.items || [], al = r.al || [];
  const itemHtml = list => '<dl class="items">' + list.map(x => '<dt>' + hl(x[0]) + '</dt><dd>' + hl(x[1]) + '</dd>').join('') + '</dl>';
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>Logic / function</span><span>' + sysLine(r) + '</span></div>' +
    '<div class="ttl">' + hl(r.title) + '</div>' +
    (items.length ? '<div class="sec">' + (items.length > 8 && !open ? itemHtml(items.slice(0, 6)) + '<details><summary>All ' + items.length + ' rows</summary>' + itemHtml(items.slice(6)) + '</details>' : itemHtml(items)) + '</div>' : '') +
    (al.length ? '<div class="sec"><div class="sech">Alarms, trips and set points</div>' + al.map(a => '<div style="font-size:13.5px;margin:4px 0">' + hl(a[0]) + (a[1] || a[2] || a[3] ? ' <span class="sub">' + hl([a[1], a[2], a[3]].filter(Boolean).join(' · ')) + '</span>' : '') + '</div>').join('') + '</div>' : '') +
    (r.tags && r.tags.length ? '<div class="sec"><div class="sech">Tags</div><div class="chips">' + r.tags.map(t => go(t, '', 'small')).join('') + '</div></div>' : '') +
    (r.n ? '<div class="sub" style="margin-top:8px">' + hl(r.n) + '</div>' : '') + refs(r.ref) + '</div>';
}
function cardScr(r, exact){
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>IAS screen (mimic)</span><span>' + esc(r.sec || '') + '</span></div>' +
    '<div class="ttl">' + hl(r.title) + '</div><div class="sub">K-Chief 700 mimic book 5354211 rev C, PDF page ' + esc(r.page) + '</div>' +
    (r.sys && r.sys.length ? '<div class="sub">' + r.sys.map(s => esc(SYS[s])).join(' · ') + '</div>' : '') +
    (r.tags && r.tags.length ? '<div class="sec"><div class="sech">Tags on this screen</div><div class="chips">' + r.tags.map(t => go(t, '', 'small')).join('') + '</div></div>' : '') +
    (r.n ? '<div class="sub" style="margin-top:8px">' + hl(r.n) + '</div>' : '') + '</div>';
}
function cardUnit(r, exact){
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>Unit</span><span>' + sysLine(r) + '</span></div>' +
    '<div class="ttl">' + hl(r.name) + '</div>' +
    '<div class="fields">' + field('Type', hl(r.type)) + field('Location', hl(r.loc)) + field('Connects to', hl(txt(r.conn))) + '</div>' +
    (r.fn && r.fn.length ? '<div class="sec"><div class="sech">Functions</div><ul style="margin:0;padding-left:18px;font-size:13.5px">' + r.fn.map(f => '<li>' + hl(f) + '</li>').join('') + '</ul></div>' : '') +
    (r.n ? '<div class="sub" style="margin-top:8px">' + hl(r.n) + '</div>' : '') + refs(r.ref) + '</div>';
}
function cardCab(r, exact){
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>Cable</span></div>' +
    '<div class="chips" style="margin-top:0">' + copyChip(r.no, 'Cable no.') + '</div>' +
    '<div class="fields">' + field('Type', hl(r.type)) + field('Signal', hl(r.sig)) + field('From', hl(r.from)) + field('To', hl(r.to)) + field('Notes', hl(r.n)) + '</div>' + refs(r.ref) + '</div>';
}
function cardHow(r, exact){
  return '<div class="card' + (exact ? ' exact' : '') + '"><div class="kind"><span>Guide</span><span>' + esc(SYS[r.s] || '') + '</span></div>' +
    '<div class="ttl">' + hl(r.title) + '</div><ol class="steps">' + (r.steps || []).map(s => '<li>' + hl(s) + '</li>').join('') + '</ol>' + refs(r.ref) + '</div>';
}
function card(r, exact){
  if (r.T === 'sig') return cardSig(r, exact);
  if (r.T === 'grp') return cardGrp(r, exact);
  if (r.T === 'fn') return cardFn(r, exact);
  if (r.T === 'scr') return cardScr(r, exact);
  if (r.T === 'unit') return cardUnit(r, exact);
  if (r.T === 'cab') return cardCab(r, exact);
  return cardHow(r, exact);
}

// ---------------- search ----------------
let filter = 'all', sysFilter = null, shown = 40;
const $q = $('q'), $out = $('out'), $st = $('status'), $clr = $('clr');
function pass(r){
  if (sysFilter != null && r.s !== sysFilter && !(r.sys && r.sys.includes(sysFilter))) return false;
  if (engine && r.T === 'sig' && r.e && r.e !== engine && r.e !== 'B') return false;
  if (filter === 'all') return true;
  if ('ASCL'.includes(filter)) return r.T === 'sig' && (r.rl || []).includes(filter);
  if (filter === 'grp') return r.T === 'grp';
  if (filter === 'fn') return r.T === 'fn';
  if (filter === 'scr') return r.T === 'scr';
  if (filter === 'hw') return r.T === 'unit' || r.T === 'cab';
  if (filter === 'how') return r.T === 'how';
  return true;
}
const TYPEBOOST = {grp:5, sig:3, fn:2, scr:2, unit:1, cab:0, how:1};
function search(q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  const qs = squash(q);
  const res = [];
  for (const r of rows){
    if (!pass(r)) continue;
    let ok = true, score = TYPEBOOST[r.T] || 0;
    for (const t of toks){
      const st = squash(t);
      const i = r.hay.indexOf(t);
      if (i >= 0) score += (i === 0 ? 4 : 1);
      else if (st.length >= 2 && r.hayS.indexOf(st) >= 0) score += 2;
      else { ok = false; break; }
    }
    if (!ok) continue;
    if (r.T === 'sig'){
      if (squash(r.k) === qs || (r.t || []).some(t => squash(t) === qs)) score += 200;
      else if ((r.io || []).some(x => squash(x.tag) === qs)) score += 180;
      else if (qs.length >= 4 && squash(r.k).startsWith(qs)) score += 40;
    }
    if (r.T === 'grp' && r.sig.some(i => squash(D.sig[i].k) === qs)) score += 150;
    if (r.T === 'cab' && squash(r.no) === qs) score += 200;
    if ((r.title || r.name) && norm(r.title || r.name).includes(norm(q))) score += 12;
    res.push([score, r]);
  }
  res.sort((a, b) => b[0] - a[0]);
  return {toks, res: res.map(x => x[1])};
}
function isExact(r, qs){
  if (r.T === 'sig') return squash(r.k) === qs || (r.t || []).some(t => squash(t) === qs) || (r.io || []).some(x => squash(x.tag) === qs);
  if (r.T === 'cab') return squash(r.no) === qs;
  return false;
}
function home(){
  const counts = new Map();
  for (const r of rows) if (r.s != null) counts.set(r.s, (counts.get(r.s) || 0) + 1);
  const sysl = SYS.map((n, i) => [n, i, counts.get(i) || 0]).filter(x => x[2]).sort((a, b) => b[2] - a[2]);
  return '<div class="empty">' +
    '<p><b style="color:var(--ink)">Search ' + rows.length.toLocaleString() + ' tags, alarms, set points, logic and IAS screens.</b> Words can be in any order. Tap a tag to copy it; tap a tag with an arrow to jump to it.</p>' +
    '<div class="ex">' + D.examples.map(x => '<button data-ex="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>' +
    '<h2>What the colours mean</h2><div class="legend">' + ['A','S','C','L','I'].map(k => roleBadge(k) + '<span>' + esc(ROLELONG[k]) + '</span>').join('') + '</div>' +
    '<p>On WinGD engine tags the last letter tells you the same thing: <b style="color:var(--ink)">A</b> alarm system, <b style="color:var(--ink)">S</b> safety system, <b style="color:var(--ink)">C</b> control system, <b style="color:var(--ink)">L / M</b> local. Kongsberg tags start with <b style="color:var(--ink)">P</b> (Port ME) or <b style="color:var(--ink)">S</b> (Stbd ME).</p>' +
    '<h2>Browse by system</h2><div class="syslist">' + sysl.map(x => '<button data-sys="' + x[1] + '">' + esc(x[0]) + '<span>' + x[2] + '</span></button>').join('') + '</div>' +
    '</div>';
}
function render(){
  const q = $q.value.trim();
  $clr.hidden = !q && sysFilter == null;
  $('back').hidden = !hist.length;
  if (q.length < 2 && sysFilter == null && filter === 'all'){ TOKS = []; $st.textContent = ''; $out.innerHTML = home(); return; }
  const {toks, res} = search(q.length < 2 ? '' : q);
  TOKS = toks;
  const label = sysFilter != null ? SYS[sysFilter] + (q ? ' · ' : '') : '';
  $st.innerHTML = esc(label) + res.length.toLocaleString() + (res.length === 1 ? ' match' : ' matches') + (sysFilter != null ? ' · <button class="link" id="clrsys" style="padding:0">clear system</button>' : '');
  if (!res.length){ $out.innerHTML = '<div class="empty"><p>No match.</p><p>Try fewer words, part of the tag (e.g. 2002), or switch the filter back to All.</p></div>'; return; }
  const qs = squash(q);
  let html = res.slice(0, shown).map(r => card(r, qs.length > 2 && isExact(r, qs))).join('');
  if (res.length > shown) html += '<button class="more" id="more">Show more (' + (res.length - shown).toLocaleString() + ' left)</button>';
  $out.innerHTML = html;
}
const hist = [];
function navigate(q){ hist.push([$q.value, filter, sysFilter]); $q.value = q; sysFilter = null; setFilter('all'); shown = 40; render(); window.scrollTo(0, 0); }
function openOne(kind, i){
  hist.push([$q.value, filter, sysFilter]);
  const r = kind === 'fn' ? Object.assign({T:'fn', i}, D.fn[i]) : Object.assign({T:'scr', i}, D.scr[i]);
  $('back').hidden = false; TOKS = [];
  $st.textContent = kind === 'fn' ? 'Logic' : 'IAS screen';
  $out.innerHTML = kind === 'fn' ? cardFn(r, false, true) : cardScr(r, false);
  window.scrollTo(0, 0);
}
function setFilter(f){ filter = f; document.querySelectorAll('.filters button[data-f]').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === f ? 'true' : 'false')); }
function setEngine(e){ engine = e; document.querySelectorAll('.filters button[data-e]').forEach(x => x.setAttribute('aria-pressed', x.dataset.e === e ? 'true' : 'false')); save('ias-tag-finder-engine', e); }
try { const e0 = load('ias-tag-finder-engine'); if (e0 === 'P' || e0 === 'S') setEngine(e0); } catch(_){}
let timer;
$q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { shown = 40; render(); window.scrollTo(0, 0); }, 130); });
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });
$clr.addEventListener('click', () => { $q.value = ''; sysFilter = null; render(); $q.focus(); });
$('back').addEventListener('click', () => { const h = hist.pop(); if (!h) return; $q.value = h[0]; setFilter(h[1]); sysFilter = h[2]; shown = 40; render(); });
document.querySelectorAll('.filters button[data-f]').forEach(b => b.addEventListener('click', () => { setFilter(b.dataset.f); shown = 40; render(); }));
document.querySelectorAll('.filters button[data-e]').forEach(b => b.addEventListener('click', () => { setEngine(b.dataset.e); render(); }));
$st.addEventListener('click', e => { if (e.target.id === 'clrsys'){ sysFilter = null; render(); } });
$out.addEventListener('click', e => {
  if (e.target.id === 'more'){ shown += 80; render(); return; }
  const ex = e.target.closest('[data-ex]'); if (ex){ navigate(ex.dataset.ex); return; }
  const sy = e.target.closest('[data-sys]'); if (sy){ hist.push([$q.value, filter, sysFilter]); sysFilter = +sy.dataset.sys; $q.value = ''; shown = 40; render(); window.scrollTo(0, 0); return; }
  const g = e.target.closest('[data-go]'); if (g){ navigate(g.dataset.go); return; }
  const f = e.target.closest('[data-fn]'); if (f){ openOne('fn', +f.dataset.fn); return; }
  const s = e.target.closest('[data-scr]'); if (s){ openOne('scr', +s.dataset.scr); return; }
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const v = b.dataset.copy, done = () => toast('Copied ' + v);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, () => fallback(v, done)); else fallback(v, done);
});
function fallback(v, done){ const t = document.createElement('textarea'); t.value = v; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(_) {} t.remove(); }
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1400); }
$('foot').innerHTML = D.meta.foot + '<br><button class="link" id="forget">Forget access code on this device</button>';
$('foot').addEventListener('click', e => { if (e.target.id === 'forget'){ save(KEYNAME, null); toast('Access code forgotten'); setTimeout(() => location.reload(), 600); } });
render();
})();
(function(){
  const el = document.getElementById('offline');
  const show = (t, cls) => { el.textContent = t; el.className = 'offl' + (cls ? ' ' + cls : ''); el.hidden = false; };
  const CACHE = 'ias-tag-finder-v2';
  if (/claude\.ai|claudeusercontent/.test(location.hostname)) {
    show('This claude.ai page needs a connection. For offline use open the GitHub Pages copy once while online; it is then kept on the device.');
    return;
  }
  if ((location.protocol !== 'https:' && location.hostname !== 'localhost') || !('serviceWorker' in navigator) || !window.caches) {
    show('Offline copy not possible here (needs https and a browser with service workers).', 'bad');
    return;
  }
  let tries = 0;
  const check = () => caches.open(CACHE).then(c => c.match('./index.html')).then(r => {
    if (r) show('Saved for offline use on this device. The page now opens without a connection.', 'ok');
    else if (tries++ < 10) { show('Saving for offline use…'); setTimeout(check, 2000); }
    else show('Offline copy not saved yet. Reload this page once while online.', 'bad');
  }).catch(() => show('Offline copy not saved (browser storage blocked, e.g. private mode).', 'bad'));
  navigator.serviceWorker.register('sw.js').then(check).catch(() => show('Offline copy not saved: service worker failed to install.', 'bad'));
})();
</script>
